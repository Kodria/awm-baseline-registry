# AWM Semgrep rules — security patterns for Python
# Usage: semgrep --config .semgrep.awm.yml --json .

rules:
  - id: awm-py-no-eval-exec
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)
      - pattern-not: eval("...")
      - pattern-not: exec("...")
    message: >
      SENSOR[security] Avoid eval()/exec() on non-literal input — it executes
      arbitrary code and is a security risk.
      Fix: use ast.literal_eval() for literals, or refactor to avoid dynamic
      code execution.
    languages: [python]
    severity: ERROR

  - id: awm-py-subprocess-shell-true
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_call($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.run("...", ..., shell=True, ...)
      - pattern-not: subprocess.call("...", ..., shell=True, ...)
      - pattern-not: subprocess.check_call("...", ..., shell=True, ...)
      - pattern-not: subprocess.check_output("...", ..., shell=True, ...)
      - pattern-not: subprocess.Popen("...", ..., shell=True, ...)
    message: >
      SENSOR[security] subprocess call with shell=True and a non-literal
      command — possible command injection.
      Fix: pass the command as a list and drop shell=True, or sanitize/quote
      the input with shlex.quote() before interpolating it.
    languages: [python]
    severity: ERROR

  - id: awm-py-no-sql-string-building
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute($QUERY % (...))
          - pattern: $CURSOR.execute($QUERY % $VAR)
          - pattern: $CURSOR.execute($QUERY.format(...))
          - pattern: $CURSOR.execute(f"...")
          - pattern: $CURSOR.execute("..." + $VAR)
          - pattern: $CURSOR.execute($VAR + "...")
    message: >
      SENSOR[security] Possible SQL injection via string formatting/concatenation
      into a query (f-string, %-formatting, .format(), or +).
      Fix: use parameterized queries — pass values as a separate execute()
      argument (e.g. cursor.execute(query, (value,))) instead of building SQL
      with string interpolation.
    languages: [python]
    severity: ERROR

  - id: awm-py-unsafe-deserialization
    patterns:
      - pattern-either:
          - pattern: pickle.load(...)
          - pattern: pickle.loads(...)
          - pattern: yaml.load($DATA)
      - pattern-not: yaml.load($DATA, Loader=yaml.SafeLoader)
    message: >
      SENSOR[security] Unsafe deserialization of untrusted data.
      Fix: use yaml.safe_load() instead of yaml.load(), and avoid
      pickle.load()/pickle.loads() on data you don't fully trust — pickle can
      execute arbitrary code during unpickling.
    languages: [python]
    severity: ERROR

  - id: awm-py-no-hardcoded-secrets
    patterns:
      - pattern: $VAR = "..."
      - metavariable-regex:
          metavariable: $VAR
          regex: (?i).*(password|secret|api_key|apikey|token|passwd).*
    message: >
      SENSOR[security] Potential hardcoded secret in variable '$VAR'.
      Fix: use environment variables or a secrets manager instead.
    languages: [python]
    severity: WARNING
