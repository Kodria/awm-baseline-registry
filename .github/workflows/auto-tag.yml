name: Auto-tag registry release

# Corta un tag vX.Y.Z al mergear contenido a main, para que `awm update` lo entregue.
# El tag es la versión del REGISTRY (lo único que el CLI consume: pin > último tag > HEAD),
# independiente de las versiones de bundle en catalog.json. Nivel de bump por conventional
# commits del merge. Ver docs/plans/2026-07-22-auto-tag-on-merge-design.md.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.github/**'

permissions:
  contents: write

concurrency:
  group: auto-tag
  cancel-in-progress: false

jobs:
  sensor-certification:
    uses: ./.github/workflows/sensor-pack-certification.yml

  tag:
    needs: sensor-certification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Semgrep 1.173 requires Python >=3.10; make the release gate's
      # interpreter explicit instead of depending on runner defaults.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tag is what `awm update` delivers, so it must never be cut over a
      # red gate. validate.yml runs on the same push, but as a separate
      # workflow it cannot block this job — re-running the checks here is what
      # actually makes the release conditional on them.
      - name: Verify registry before tagging
        run: |
          python -m pip install "semgrep==1.173.0"
          node scripts/validate-portability.mjs
          node tests/validate-portability.test.mjs
          node tests/r3-release-metadata.test.mjs
          node tests/cycle-evidence-capture-contract.test.mjs
          node tests/r3-retro-contract.test.mjs
          node tests/r8-sensor-gate-contract.test.mjs
          node tests/r9-declared-orchestrators-contract.test.mjs
          node tests/r10-documentation-phase-contract.test.mjs
          node tests/r11-process-lifecycle-contract.test.mjs
          node tests/release-skill-version-gate.test.mjs
          node tests/codex-session-start.test.mjs
          node tests/session-start.test.mjs
          node tests/sensor-pack-eslint.test.mjs
          node tests/sensor-pack-shape.test.mjs
          node tests/sensor-pack-python-shell-generic.test.mjs
          node tests/sensor-pack-variants.test.mjs
          node tests/sensor-pack-coverage.test.mjs
          node tests/sensor-pack-coverage-mutations.test.mjs
          node --test tests/sensor-pack-rules-fire.test.mjs
          ./scripts/check-skill-version-bumps.sh "${{ github.event.before }}" HEAD

      - name: Compute and push next tag
        run: |
          set -euo pipefail

          # R4 — idempotencia: si HEAD ya es exactamente un tag vX.Y.Z, no hacer nada.
          if git describe --tags --exact-match HEAD 2>/dev/null | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD ya está taggeado ($(git describe --tags --exact-match HEAD)) — nada que hacer."
            exit 0
          fi

          # R5 — último tag semver, o v0.0.0 si no hay ninguno.
          LATEST=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
            echo "No hay tags previos — arrancando desde $LATEST."
          fi
          echo "Último tag: $LATEST"

          # R2 — nivel de bump por conventional commits del commit de merge (subject + body).
          MSG="$(git log -1 --format='%s%n%b' HEAD)"
          SUBJECT="$(git log -1 --format='%s' HEAD)"
          if printf '%s' "$SUBJECT" | grep -qE '^[a-z]+(\([^)]+\))?!:' || printf '%s' "$MSG" | grep -qE 'BREAKING[ -]CHANGE'; then
            BUMP="major"
          elif printf '%s' "$SUBJECT" | grep -qE '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          else
            BUMP="patch"
          fi
          echo "Nivel de bump derivado: $BUMP"

          # Calcular el próximo tag.
          VER="${LATEST#v}"
          MAJ="${VER%%.*}"
          REST="${VER#*.}"
          MIN="${REST%%.*}"
          PAT="${REST#*.}"
          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          NEXT="v${MAJ}.${MIN}.${PAT}"
          echo "Próximo tag: $NEXT"

          # Guarda extra: si el tag calculado ya existe (rerun/carrera), salir limpio.
          if git rev-parse "$NEXT" >/dev/null 2>&1; then
            echo "$NEXT ya existe — nada que hacer."
            exit 0
          fi

          # R1/R6 — crear y pushear el tag con el GITHUB_TOKEN.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "$NEXT (auto-tag: $BUMP desde $LATEST)"
          git push origin "$NEXT"
          echo "Tag $NEXT pusheado."
