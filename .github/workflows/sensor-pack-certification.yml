name: Sensor pack certification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  certify:
    name: ${{ matrix.os }} sensor-pack contract
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
            python-profile: minimum
          - os: ubuntu-latest
            python: "3.12"
            python-profile: current
          - os: macos-latest
            python: "3.12"
            python-profile: current
          - os: windows-latest
            python: "3.12"
            python-profile: current
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate frozen pack contracts and generated support
        run: |
          node tests/sensor-pack-variants.test.mjs
          node tests/sensor-pack-python-shell-generic.test.mjs
          node tests/sensor-pack-certification.test.mjs
          node scripts/render-sensor-support-matrix.mjs --check
          node tests/sensor-pack-support-matrix.test.mjs
      - name: Exercise pinned ESLint minimum and current variants
        run: node tests/sensor-pack-eslint.test.mjs
      - name: Exercise pinned Python minimum toolchain
        if: matrix.python-profile == 'minimum'
        run: |
          python -m pip install "mypy==1.18.2" "ruff==0.16.3" "pytest==8.4.2"
          python -m mypy tests/fixtures/python-certification
          python -m ruff check tests/fixtures/python-certification --output-format json
          python -m pytest tests/fixtures/python-certification
      - name: Smoke-test pinned Python current toolchain
        if: matrix.python-profile == 'current'
        run: |
          python -m pip install "mypy==1.18.2" "ruff==0.16.3" "pytest==8.4.2"
          python -m mypy tests/fixtures/python-certification
          python -m ruff check tests/fixtures/python-certification --output-format json
          python -m pytest tests/fixtures/python-certification
      - name: Exercise Ubuntu security and shell tooling
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install "semgrep==1.173.0"
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          node --test tests/sensor-pack-rules-fire.test.mjs
